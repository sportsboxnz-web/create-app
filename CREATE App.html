  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

─────────────────── */\n.hero {\n  background: var(--td-green);\n  padding: 56px 56px 56px;\n  position: relative;\n  overflow: hidden;\n  color: var(--td-white-pure);\n}\n.hero::after {\n  content: \"\";\n  position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 22px;\n  background: var(--td-green-dk);\n}\n\n.td-logo {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 0.08em;\n  color: var(--td-white-pure);\n  line-height: 1;\n  margin-bottom: 36px;\n  font-family: var(--font);\n}\n.td-logo .td-tile  { font-size: 28px; font-weight: 800; letter-spacing: 0.01em; }\n.td-logo .td-depot { font-size: 28px; font-weight: 300; letter-spacing: 0.02em; }\n\n.hero-eyebrow {\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  opacity: 0.75;\n  margin-bottom: 14px;\n}\n\n.hero-title {\n  font-size: 64px;\n  font-weight: 700;\n  letter-spacing: -0.025em;\n  line-height: 0.95;\n  margin-bottom: 18px;\n}\n\n.hero-sub {\n  font-size: 17px;\n  opacity: 0.82;\n  font-weight: 400;\n  letter-spacing: 0.01em;\n  max-width: 36ch;\n}\n\n/* ── DOC NAV (return home) ──────────────────────────── */\n.docnav {\n  background: var(--td-green-dk);\n  padding: 10px 56px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--td-white);\n}\n.docnav a {\n  color: var(--td-white);\n  opacity: 0.8;\n  text-decoration: none;\n  transition: opacity 0.15s ease;\n}\n.docnav a:hover { opacity: 1; }\n.docnav .sep { opacity: 0.4; }\n\n/* ── BODY CONTAINER ─────────────────────────────────── */\n.body {\n  padding: 40px 56px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 22px;\n}\n\n/* ── SECTION HEADINGS ───────────────────────────────── */\n.section-label {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--td-green);\n  margin-bottom: 6px;\n}\n\nh2.section {\n  font-size: 30px;\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  color: var(--td-ink);\n  line-height: 1.1;\n  margin-bottom: 4px;\n}\n\n/* ── INTRO CARD ─────────────────────────────────────── */\n.intro {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-left: 3px solid var(--td-green);\n  border-radius: var(--radius);\n  padding: 22px 26px;\n  box-shadow: var(--shadow);\n}\n.intro h3 {\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--td-green);\n  margin-bottom: 10px;\n}\n.intro p {\n  font-size: 15px;\n  color: var(--td-ink-md);\n  line-height: 1.6;\n}\n.intro p + p { margin-top: 10px; }\n\n/* ── RULE CARD (the small bold callout) ─────────────── */\n.rule {\n  background: var(--td-green-xl);\n  border-radius: var(--radius);\n  padding: 18px 24px;\n  display: flex;\n  gap: 18px;\n  align-items: baseline;\n}\n.rule .rule-label {\n  font-size: 10px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--td-green);\n  flex-shrink: 0;\n  padding-top: 2px;\n}\n.rule p {\n  font-size: 15px;\n  color: var(--td-green-dk);\n  font-weight: 500;\n  line-height: 1.5;\n}\n\n/* ── AT A GLANCE TABLE ──────────────────────────────── */\n.glance {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  overflow: hidden;\n  box-shadow: var(--shadow);\n}\n.glance-head {\n  background: var(--td-green);\n  color: var(--td-white-pure);\n  padding: 14px 22px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  position: relative;\n}\n.glance-head::after {\n  content: \"\";\n  position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 6px;\n  background: var(--td-green-dk);\n}\n.glance-head h3 {\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n}\n.glance-head .count {\n  font-size: 11px;\n  letter-spacin ield .field-value {\n  font-size: 14px;\n  color: var(--td-ink-md);\n  line-height: 1.55;\n}\n\n.field.wide { grid-column: 1 / -1; }\n\n/* Whiteboard line — fixed-width inline-block of dashes/blanks */\n.board-line {\n  background: var(--td-grey-lt);\n  border-radius: var(--radius-sm);\n  border-left: 3px solid var(--td-green);\n  padding: 12px 16px;\n  font-size: 14px;\n  color: var(--td-ink);\n  font-weight: 500;\n  line-height: 1.5;\n}\n\n/* Friday review — quote style */\n.friday {\n  background: var(--td-green-xl);\n  border-left: 3px solid var(--td-green);\n  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;\n  padding: 14px 18px;\n  font-size: 14px;\n  font-style: italic;\n  color: var(--td-green-dk);\n  line-height: 1.65;\n}\n\n/* Why It Works / Manager Tip — two-column subnote row */\n.subnote-row {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 0;\n  border-top: 1px solid var(--td-grey-md);\n  background: var(--td-grey-lt);\n}\n.subnote {\n  padding: 18px 26px;\n}\n.subnote + .subnote {\n  border-left: 1px solid var(--td-grey-md);\n}\n.subnote .field-label {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  color: var(--td-green);\n  margin-bottom: 8px;\n}\n.subnote p {\n  font-size: 13.5px;\n  color: var(--td-ink-md);\n  line-height: 1.55;\n}\n\n/* ── NUDGES TABLE ───────────────────────────────────── */\n.nudges {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n\n.nudges-list { }\n.nudge-row {\n  display: grid;\n  grid-template-columns: 64px 1fr;\n  align-items: baseline;\n  gap: 16px;\n  padding: 14px 24px;\n  border-bottom: 1px solid var(--td-grey-lt);\n  position: relative;\n}\n.nudge-row:last-child { border-bottom: none; }\n\n.nudge-row::before {\n  content: \"\";\n  position: absolute;\n  left: 0; top: 0; bottom: 0;\n  width: 3px;\n  background: var(--td-green);\n  opacity: 0;\n  transition: opacity 0.15s ease;\n}\n.nudge-row:hover { background: var(--td-green-xl); }\n.nudge-row:hover::before { opacity: 1; }\n\n.nudge-n {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--td-green-dk);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0.04em;\n  padding-top: 2px;\n}\n.nudge-text {\n  font-size: 15px;\n  color: var(--td-ink);\n  line-height: 1.5;\n  letter-spacing: -0.003em;\n}\n.nudge-row .lead {\n  display: inline-block;\n  font-weight: 700;\n  color: var(--td-green-dk);\n  margin-right: 6px;\n}\n\n/* Manager tip card (below each nudge block) */\n.tip {\n  background: var(--td-green-dk);\n  border-radius: var(--radius);\n  padding: 20px 26px;\n  color: var(--td-white-pure);\n  position: relative;\n  overflow: hidden;\n}\n.tip::after {\n  content: \"\";\n  position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 6px;\n  background: var(--td-green);\n}\n.tip .field-label {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  color: var(--td-green-lt);\n  margin-bottom: 8px;\n  opacity: 0.9;\n}\n.tip p {\n  font-size: 14px;\n  color: var(--td-white);\n  line-height: 1.55;\n  opacity: 0.95;\n}\n\n/* ── CLOSING / FOOTER STATEMENT ─────────────────────── */\n.closing {\n  background: var(--td-green);\n  color: var(--td-white-pure);\n  border-radius: var(--radius);\n  padding: 44px 40px;\n  text-align: left;\n  position: relative;\n  overflow: hidden;\n}\n.closing::after {\n  content: \"\";\n  position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 14px;\n  background: var(--td-green-dk);\n}\n.closing .line {\n  font-size: 32px;\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n}\n.closing .line + .line { margin-top: 6px; opacity: 0.7; font-weight: 300; }\n.closing .line.dim { opacity: 0.5; }\n\n/* ── RHYTHM LIST ────────────────────────────────────── */\n.rhythm {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n order-radius: 0 2px 2px 0;\n  opacity: 0;\n  transition: opacity 0.12s ease;\n}\n.dt-tile:hover {\n  border-color: var(--td-green-lt);\n  box-shadow: var(--shadow-lg);\n  transform: translateY(-1px);\n}\n.dt-tile:hover::before { opacity: 1; }\n\n.dt-tile .lbadge.lg {\n  background: var(--td-green-xl);\n  color: var(--td-green);\n}\n.dt-tile-body { flex: 1; }\n.dt-tile-label {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--td-grey);\n  margin-bottom: 6px;\n}\n.dt-tile-title {\n  font-size: 22px;\n  font-weight: 700;\n  letter-spacing: -0.015em;\n  color: var(--td-ink);\n  margin-bottom: 4px;\n}\n.dt-tile-desc {\n  font-size: 14px;\n  color: var(--td-ink-md);\n  line-height: 1.5;\n}\n.dt-tile .arrow {\n  font-size: 26px;\n  font-weight: 300;\n  color: var(--td-grey);\n  flex-shrink: 0;\n}\n\n/* ── RESPONSIVE ─────────────────────────────────────── */\n@media (max-width: 720px) {\n  .hero {\n    padding: 36px 24px;\n  }\n  .hero-title { font-size: 44px; }\n  .docnav { padding: 10px 24px; }\n  .body { padding: 28px 24px 12px; gap: 18px; }\n  .detail-body { grid-template-columns: 1fr; gap: 18px; padding: 20px 22px 20px; }\n  .subnote-row { grid-template-columns: 1fr; }\n  .subnote + .subnote { border-left: none; border-top: 1px solid var(--td-grey-md); }\n  .step-divider { flex-direction: column; align-items: flex-start; gap: 12px; }\n  .step-divider .step-name { font-size: 24px; }\n  .nudge-row { padding: 12px 18px; gap: 12px; grid-template-columns: 44px 1fr; }\n  .nudge-text { font-size: 14px; }\n  .glance table { font-size: 12.5px; }\n  .glance thead th, .glance tbody td { padding: 10px 10px; }\n  .glance .type-cell { display: none; }\n  .glance thead th.type-cell { display: none; }\n  .rhythm dl > div { grid-template-columns: 1fr; gap: 4px; }\n  .closing { padding: 32px 24px; }\n  .closing .line { font-size: 24px; }\n  .dt-tile { padding: 18px; gap: 16px; }\n  .dt-tile-title { font-size: 18px; }\n}\n\n/* ── PRINT ──────────────────────────────────────────── */\n@media print {\n  @page { margin: 0.5in; size: A4; }\n  html, body { background: white; }\n  .docnav { display: none; }\n  .page { max-width: none; }\n  .hero {\n    padding: 32px 32px;\n    page-break-after: avoid;\n  }\n  .hero::after { display: none; }\n  .body { padding: 24px 32px; gap: 16px; }\n  .detail, .nudges, .glance, .intro, .rhythm, .closing, .tip {\n    box-shadow: none;\n    break-inside: avoid;\n    page-break-inside: avoid;\n  }\n  .step-divider { page-break-after: avoid; }\n  .detail { page-break-inside: avoid; }\n  .nudge-row:hover { background: transparent; }\n}\n<\u002Fstyle>\n<style>\n/* ────────────────────────────────────────────────────────\n   Integrated-toolkit additions\n   Sticky tab nav · interactive sections · doc layout\n──────────────────────────────────────────────────────── */\n\n.toolkit-nav {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: var(--td-green-dk);\n  color: var(--td-white);\n  display: flex;\n  align-items: center;\n  gap: 0;\n  padding: 0 32px;\n  border-bottom: 1px solid rgba(255,255,255,0.08);\n}\n.toolkit-nav .brand {\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  padding: 14px 18px 14px 0;\n  opacity: 0.85;\n  white-space: nowrap;\n}\n.toolkit-nav .brand strong { font-weight: 800; }\n.toolkit-nav .spacer { flex: 1; }\n.toolkit-nav a.tab {\n  color: var(--td-white);\n  text-decoration: none;\n  padding: 14px 18px;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  opacity: 0.7;\n  transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;\n  border-bottom: 2px solid transparent;\n  white-space: nowrap;\n}\n.toolkit-nav a.tab:hover { opacity: 1; background: rgba(255,255,255,0.04); }\n.toolkit-nav a.tab.active { opacity: 1; border-bottom-color: var(--td-green-lt); }\n\n/* Narrow-desktop fit: tighten tabs so all six stay on one line */\n@media (max-width: 1080px) {\n  .toolkit-nav { padding: 0 18px; }\n  .toolkit-nav .brand { padding-right: 12px; font-size: 10px; letter-spacing: 0.18em; }\n  .toolkit-nav a.tab { padding: 14px 12px; letter-spacing: 0.1em; }\n}\n@media (max-width: 880px) and (min-width: 721px) {\n  .toolkit-nav .brand { display: none; }\n}\n\n.toolkit-frame {\n  max-width: 880px;\n  margin: 0 auto;\n  background: var(--td-white);\n}\n.doc-section { scroll-margin-top: 56px; }\n\n/* ── Overview tiles: 5 across in 2-up + 3-up grid ─────── */\n.overview-tiles {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 14px;\n}\n.overview-tiles .dt-tile { padding: 22px 22px; gap: 16px; flex-direction: column; align-items: flex-start; }\n.overview-tiles .dt-tile .arrow { display: none; }\n.overview-tiles .dt-tile .lbadge.lg { margin-bottom: 4px; }\n.overview-tiles .dt-tile-title { font-size: 19px; }\n.overview-tiles .dt-tile-desc { font-size: 13.5px; }\n.overview-group-label {\n  font-size: 10px; font-weight: 700; letter-spacing: 0.22em;\n  text-transform: uppercase; color: var(--td-green);\n  margin: 18px 0 4px;\n}\n.overview-group-label:first-child { margin-top: 0; }\n\n/* ══════════════════════════════════════════════════════\n   LAUNCH SCRIPT — accordions for the 7 steps\n══════════════════════════════════════════════════════ */\n.script-list { display: flex; flex-direction: column; gap: 12px; }\n.script-step {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n.script-step > summary {\n  list-style: none;\n  cursor: pointer;\n  padding: 18px 24px;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  user-select: none;\n  background: var(--td-white-pure);\n  transition: background 0.12s ease;\n  outline: none;\n}\n.script-step > summary::-webkit-details-marker { display: none; }\n.script-step > summary::marker { content: ''; }\n.script-step > summary:hover { background: var(--td-grey-lt); }\n.script-step[open] > summary { border-bottom: 1px solid var(--td-green-lt); }\n.script-step .step-num {\n  width: 36px; height: 36px; border-radius: 3px;\n  background: var(--td-green); color: var(--td-white-pure);\n  font-weight: 700; font-size: 16px;\n  display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0;\n}\n.script-step .step-meta { flex: 1; }\n.script-step .step-title {\n  font-size: 18px; font-weight: 700; color: var(--td-ink);\n  letter-spacing: -0.01em; line-height: 1.2;\n}\n.script-step .step-time {\n  font-size: 11px; color: var(--td-grey);\n  margin-top: 3px; letter-spacing: 0.08em;\n  font-variant-numeric: tabular-nums; font-weight: 500;\n}\n.script-step .chevron {\n  font-size: 16px; color: var(--td-grey); font-weight: 300;\n  transition: transform 0.2s ease;\n}\n.script-step[open] .chevron { transform: rotate(180deg); }\n\n.script-step .step-body { padding: 22px 26px 24px; }\n\n.say-this {\n  background: var(--td-green-xl);\n  border-left: 3px solid var(--td-green);\n  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;\n  padding: 16px 20px;\n  margin-bottom: 14px;\n}\n.say-label {\n  font-size: 10px; font-weight: 700; letter-spacing: 0.2em;\n  text-transform: uppercase; color: var(--td-green);\n  margin-bottom: 10px;\n}\n.say-text {\n  font-size: 15px; font-style: italic;\n  color: var(--td-green-dk); line-height: 1.7;\n}\n.say-text + .say-text { margin-top: 10px; }\n\n.delivery-note {\n  background: var(--td-grey-lt);\n  border-radius: var(--radius-sm);\n  padding: 12px 18px;\n  margin-bottom: 14px;\n  font-size: 14px; color: var(--td-ink-md); line-height: 1.55;\n}\n.delivery-note strong {\n  display: block;\n  color: var(--td-green);\n  font-size: 10px; letter-spacing: 0.2em;\n  text-transform: uppercase; font-weight: 700;\n  margin-bottom: 5px;\n}\n\n.nn-list {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px 16px;\n  margin: 4px 0 14px;\n}\n.nn-row {\n  display: flex; gap: 14px; align-items: flex-start;\n  padding: 12px 14px;\n  background: var(--td-grey-lt);\n  border-radius: var(--radius-sm);\n}\n.nn-step { font-size: 14px; font-weight: 700; color: var(--td-ink); margin-bottom: 2px; }\n.nn-phrase {\n  font-size: 12.5px; color: var(--td-green-dk);\n  font-style: italic; line-height: 1.5;\n}\n\n.pathway-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n  margin-bottom: 14px;\n}\n.pathway-card {\n  background: var(--td-green);\n  border-radius: var(--radius-sm);\n  padding: 18px 20px;\n  position: relative; overflow: hidden;\n}\n.pathway-card::after {\n  content: \"\"; position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 4px; background: var(--td-green-dk);\n}\n.pathway-card h4 {\n  font-size: 11px; font-weight: 700;\n  color: var(--td-white);\n  letter-spacing: 0.18em; text-transform: uppercase;\n  margin-bottom: 12px; opacity: 0.85;\n}\n.pathway-card ul { list-style: none; }\n.pathway-card ul li {\n  color: var(--td-white-pure);\n  padding-left: 14px;\n  position: relative;\n  font-size: 13px; line-height: 1.6;\n  margin-bottom: 4px;\n}\n.pathway-card ul li::before {\n  content: \"\"; position: absolute;\n  left: 0; top: 10px;\n  width: 7px; height: 1.5px;\n  background: var(--td-white); opacity: 0.7;\n}\n\n.weapon-list { display: flex; flex-direction: column; gap: 14px; }\n.weapon {\n  display: grid;\n  grid-template-columns: 36px 1fr;\n  gap: 18px;\n  padding: 18px 0;\n  border-top: 1px solid var(--td-grey-md);\n}\n.weapon:first-child { border-top: none; padding-top: 6px; }\n.weapon-n {\n  width: 30px; height: 30px; border-radius: 50%;\n  background: var(--td-green); color: var(--td-white-pure);\n  font-weight: 700; font-size: 13px;\n  display: flex; align-items: center; justify-content: center;\n}\n.weapon-nm {\n  font-size: 16px; font-weight: 700;\n  color: var(--td-ink);\n  letter-spacing: -0.005em;\n  margin-bottom: 6px;\n}\n.weapon-ds {\n  font-size: 14px; color: var(--td-ink-md);\n  line-height: 1.6; margin-bottom: 12px;\n}\n\n.setup-list {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n.setup-item {\n  padding: 14px 16px;\n  background: var(--td-grey-lt);\n  border-left: 3px solid var(--td-green);\n  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;\n}\n.setup-label {\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--td-green);\n  margin-bottom: 5px;\n}\n.setup-text {\n  font-size: 13px; color: var(--td-ink-md);\n  line-height: 1.55;\n}\n\n.complete-card {\n  background: var(--td-green);\n  color: var(--td-white-pure);\n  border-radius: var(--radius);\n  padding: 36px 40px;\n  text-align: left;\n  position: relative; overflow: hidden;\n}\n.complete-card::after {\n  content: \"\"; position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 14px; background: var(--td-green-dk);\n}\n.complete-card .accent {\n  font-size: 11px; letter-spacing: 0.22em;\n  text-transform: uppercase; font-weight: 500;\n  opacity: 0.85;\n  display: block; margin-bottom: 10px;\n}\n.complete-card h3 {\n  font-size: 28px; font-weight: 700;\n  letter-spacing: -0.02em; line-height: 1.1;\n  margin-bottom: 8px;\n}\n.complete-card p {\n  font-size: 14px; color: var(--td-white);\n  opacity: 0.78; font-style: italic;\n}\n\n/* ══════════════════════════════════════════════════════\n   OPERATING SYSTEM — rhythm-style cards\n══════════════════════════════════════════════════════ */\n.os-grid {\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n.os-card {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n.os-card-header {\n  background: var(--td-green);\n  color: var(--td-white-pure);\n  padding: 16px 24px;\n  display: flex; align-items: center; gap: 14px;\n  position: relative;\n}\n.os-card-header::after {\n  content: \"\"; position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 6px; background: var(--td-green-dk);\n}\n.os-card-icon {\n  width: 32px; height: 32px;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--td-white-pure);\n  flex-shrink: 0;\n}\n.os-card-icon svg { width: 22px; height: 22px; }\n.os-card-title {\n  font-size: 17px; font-weight: 700;\n  color: var(--td-white-pure);\n  letter-spacing: -0.005em;\n}\n.os-card-sub {\n  font-size: 10px; color: var(--td-white);\n  opacity: 0.75; font-weight: 500;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  margin-top: 3px;\n}\n.os-card-body { padding: 18px 26px 20px; }\n.os-row {\n  display: grid;\n  grid-template-columns: 18px 1fr;\n  gap: 14px;\n  padding: 10px 0;\n  border-bottom: 1px solid var(--td-grey-md);\n  align-items: baseline;\n}\n.os-row:last-child { border-bottom: none; }\n.os-dot {\n  width: 7px; height: 7px;\n  border-radius: 50%;\n  background: var(--td-green);\n  margin: 0 auto;\n  align-self: center;\n  transform: translateY(-2px);\n}\n.os-row-text {\n  font-size: 14px;\n  color: var(--td-ink-md);\n  line-height: 1.6;\n}\n.os-row-text strong { color: var(--td-ink); font-weight: 700; }\n\n.daily-q-card {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-left: 3px solid var(--td-green);\n  border-radius: var(--radius);\n  padding: 22px 28px;\n  box-shadow: var(--shadow);\n}\n.daily-q-label {\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.2em; text-transform: uppercase;\n  color: var(--td-green);\n  margin-bottom: 10px;\n}\n.daily-q-text {\n  font-size: 22px; font-weight: 700;\n  color: var(--td-ink);\n  line-height: 1.3;\n  letter-spacing: -0.01em;\n}\n\n/* ══════════════════════════════════════════════════════\n   BEHAVIOUR CHECK — traffic light per CREATE step\n══════════════════════════════════════════════════════ */\n.week-display {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-left: 3px solid var(--td-green);\n  border-radius: var(--radius);\n  padding: 14px 22px;\n  display: flex; align-items: center;\n  justify-content: space-between;\n  box-shadow: var(--shadow);\n}\n.week-label {\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--td-grey);\n}\n.week-value {\n  font-size: 15px; font-weight: 700;\n  color: var(--td-green-dk);\n  font-variant-numeric: tabular-nums;\n}\n\n.tl-grid { display: flex; flex-direction: column; gap: 12px; }\n\n.tl-card {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n.tl-head {\n  background: var(--td-green);\n  padding: 16px 24px;\n  display: flex; align-items: center; gap: 16px;\n  position: relative;\n}\n.tl-head::after {\n  content: \"\"; position: absolute;\n  top: 0; bottom: 0; right: 0;\n  width: 6px; background: var(--td-green-dk);\n}\n.tl-head .lbadge.lg {\n  background: var(--td-white-pure);\n  color: var(--td-green);\n  width: 44px; height: 44px;\n  font-size: 22px;\n}\n.tl-step-name {\n  font-size: 18px; font-weight: 700;\n  color: var(--td-white-pure);\n  letter-spacing: -0.005em;\n}\n.tl-nn {\n  font-size: 12px; color: var(--td-white);\n  opacity: 0.78; font-style: italic;\n  margin-top: 4px; line-height: 1.4;\n}\n.tl-body {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 0;\n}\n.tl-rating-col {\n  padding: 18px 24px;\n  border-right: 1px solid var(--td-grey-md);\n}\n.tl-beh-col {\n  padding: 18px 24px;\n  background: var(--td-grey-lt);\n}\n.tl-label {\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--td-green);\n  margin-bottom: 12px;\n}\n.tl-buttons {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 8px;\n}\n.tl-btn {\n  padding: 12px 8px;\n  border: 1.5px solid var(--td-grey-md);\n  border-radius: var(--radius-sm);\n  background: var(--td-white-pure);\n  font-family: var(--font);\n  font-size: 12.5px; font-weight: 700;\n  cursor: pointer;\n  text-align: center; color: var(--td-grey);\n  letter-spacing: 0.06em; text-transform: uppercase;\n  transition: all 0.15s ease;\n}\n.tl-btn.green { border-color: var(--go); color: var(--go); }\n.tl-btn.amber { border-color: var(--amber); color: var(--amber); }\n.tl-btn.red   { border-color: var(--red); color: var(--red); }\n.tl-btn.selected.green { background: var(--go); color: var(--td-white-pure); }\n.tl-btn.selected.amber { background: var(--amber); color: var(--td-white-pure); }\n.tl-btn.selected.red   { background: var(--red); color: var(--td-white-pure); }\n\n.tl-beh-item {\n  display: grid;\n  grid-template-columns: 22px 1fr;\n  gap: 10px;\n  padding: 7px 0;\n  align-items: flex-start;\n}\n.tl-check {\n  width: 20px; height: 20px;\n  border-radius: 3px;\n  border: 1.5px solid var(--td-grey-md);\n  background: var(--td-white-pure);\n  cursor: pointer; flex-shrink: 0;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 12px; color: transparent;\n  font-weight: 700;\n  transition: all 0.15s ease;\n}\n.tl-check.checked {\n  background: var(--td-green);\n  border-color: var(--td-green);\n  color: var(--td-white-pure);\n}\n.tl-beh-text {\n  font-size: 13.5px;\n  color: var(--td-ink-md);\n  line-height: 1.5;\n}\n\n.tl-summary {\n  background: var(--td-white-pure);\n  border: 1px solid var(--td-grey-md);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n  margin-top: 6px;\n}\n.tl-summary-head {\n  background: var(--td-green-dk);\n  color: var(--td-white-pure);\n  padding: 14px 24px;\n  font-size: 13px; font-weight: 700;\n  letter-spacing: 0.18em; text-transform: uppercase;\n}\n.tl-summary-body { padding: 6px 24px; }\n.tl-summary-row {\n  display: flex; align-items: center;\n  justify-content: space-between;\n  padding: 10px 0;\n  border-bottom: 1px solid var(--td-grey-md);\n}\n.tl-summary-row:last-of-type { border-bottom: none; }\n.tl-summary-step { font-size: 14px; color: var(--td-ink); font-weight: 500; }\n.tl-summary-dot {\n  width: 28px; height: 28px; border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 13px; font-weight: 700;\n  background: var(--td-grey-md);\n  color: var(--td-white-pure);\n}\n.tl-summary-dot.green { background: var(--go); }\n.tl-summary-dot.amber { background: var(--amber); }\n.tl-summary-dot.red   { background: var(--red); }\n\n.tl-actions {\n  padding: 16px 24px;\n  border-top: 1px solid var(--td-green-lt);\n  display: flex; gap: 10px; justify-content: flex-end;\n}\n.tl-action-btn {\n  padding: 12px 22px;\n  border-radius: var(--radius-sm);\n  border: none;\n  font-family: var(--font);\n  font-size: 12.5px; font-weight: 700;\n  cursor: pointer;\n  letter-spacing: 0.08em; text-transform: uppercase;\n}\n.tl-action-btn.primary { background: var(--td-green); color: var(--td-white-pure); }\n.tl-action-btn.secondary {\n  background: var(--td-white-pure);\n  color: var(--td-ink-md);\n  border: 1px solid var(--td-grey-md);\n}\n\n.save-flash {\n  position: fixed;\n  bottom: 28px; left: 50%;\n  transform: translateX(-50%) translateY(20px);\n  background: var(--td-green-dk);\n  color: var(--td-white-pure);\n  padding: 12px 26px;\n  border-radius: var(--radius-sm);\n  font-size: 13px; font-weight: 600;\n  opacity: 0;\n  transition: all 0.3s ease;\n  pointer-events: none;\n  z-index: 999;\n  letter-spacing: 0.06em;\n}\n.save-flash.show {\n  opacity: 1;\n  transform: translateX(-50%) translateY(0);\n}\n\n/* ── Responsive shrink for the integrated layout ─────── */\n@media (max-width: 720px) {\n  .toolkit-nav { padding: 0 14px; flex-wrap: wrap; }\n  .toolkit-nav .brand { padding: 12px 0; font-size: 10px; }\n  .toolkit-nav a.tab { padding: 12px 12px; font-size: 10px; letter-spacing: 0.12em; }\n  .overview-tiles { grid-template-columns: 1fr; }\n  .nn-list { grid-template-columns: 1fr; }\n  .pathway-grid { grid-template-columns: 1fr; }\n  .setup-list { grid-template-columns: 1fr; }\n  .tl-body { grid-template-columns: 1fr; }\n  .tl-rating-col { border-right: none; border-bottom: 1px solid var(--td-grey-md); }\n  .complete-card { padding: 28px 24px; }\n  .complete-card h3 { font-size: 22px; }\n}\n\n/* ── Print: hide tab nav, keep accordions open ──────── */\n@media print {\n  .toolkit-nav, .tl-actions, .save-flash { display: none; }\n  .script-step[open] > summary { border-bottom-color: var(--td-grey-md); }\n  .script-step .chevron { display: none; }\n  details > summary { list-style: none; }\n  details:not([open]) > * + * { display: revert !important; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- Bundler thumbnail (for offline export) -->\n\n\n<!-- SVG ICON LIBRARY (for OS cards) -->\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <defs>\n    <symbol id=\"ic-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle>\n      <path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath>\n    <\u002Fsymbol>\n    <symbol id=\"ic-cal\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"1\"><\u002Frect>\n      <path d=\"M3 9h18M8 3v4M16 3v4\"><\u002Fpath>\n    <\u002Fsymbol>\n    <symbol id=\"ic-star\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6.1L12 16.8 6.6 19.6l1.2-6.1L3.3 9.3l6.1-.7z\"><\u002Fpath>\n    <\u002Fsymbol>\n    <symbol id=\"ic-chart\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M4 20V10M10 20V4M16 20v-8M22 20H2\"><\u002Fpath>\n    <\u002Fsymbol>\n    <symbol id=\"ic-rotate\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M21 12a9 9 0 1 1-3-6.7\"><\u002Fpath><path d=\"M21 4v5h-5\"><\u002Fpath>\n    <\u002Fsymbol>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n<nav class=\"toolkit-nav\" id=\"toolkitNav\">\n  <div class=\"brand\"><strong>Tile Depot<\u002Fstrong> · CREATE<\u002Fdiv>\n  <a class=\"tab\" href=\"#top\" data-target=\"top\">Overview<\u002Fa>\n  <a class=\"tab\" href=\"#script\" data-target=\"script\">Launch Script<\u002Fa>\n  <a class=\"tab\" href=\"#os\" data-target=\"os\">Operating System<\u002Fa>\n  <a class=\"tab\" href=\"#check\" data-target=\"check\">Behaviour Check<\u002Fa>\n  <a class=\"tab\" href=\"#scoreboards\" data-target=\"scoreboards\">Scoreboards<\u002Fa>\n  <a class=\"tab\" href=\"#nudges\" data-target=\"nudges\">Nudges<\u002Fa>\n  <div class=\"spacer\"><\u002Fdiv>\n<\u002Fnav>\n\n<div class=\"toolkit-frame\">\n\n<!-- ════════════════════════════════════════════════════\n     OVERVIEW\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"top\">\n  <header class=\"hero\" data-screen-label=\"Overview Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards · Manager Toolkit<\u002Fdiv>\n    <h1 class=\"hero-title\">Manager<br>Toolkit<\u002Fh1>\n    <p class=\"hero-sub\">Everything you need to launch, run, and review CREATE in your store — in one place.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <section class=\"intro\">\n      <h3>How this toolkit works<\u002Fh3>\n      <p>The toolkit has five tools, grouped into what you <em>run<\u002Fem> with the team and what you <em>reach for<\u002Fem> during the week. Use the tabs above to jump between them; no reading order required.<\u002Fp>\n      <p>Open it on your phone behind the counter, on your laptop in the back office, or print any section as A4 — every tool is designed to work all three ways.<\u002Fp>\n    <\u002Fsection>\n\n    <div class=\"overview-group-label\">Run It · With the team<\u002Fdiv>\n    <div class=\"overview-tiles\">\n      <a class=\"dt-tile\" href=\"#script\" data-target=\"script\">\n        <span class=\"lbadge lg\">LS<\u002Fspan>\n        <div class=\"dt-tile-body\">\n          <div class=\"dt-tile-label\">15-minute session<\u002Fdiv>\n          <div class=\"dt-tile-title\">Launch Script<\u002Fdiv>\n          <div class=\"dt-tile-desc\">Step-by-step script for the store launch session — seven steps from open to close.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"dt-tile\" href=\"#os\" data-target=\"os\">\n        <span class=\"lbadge lg\">OS<\u002Fspan>\n        <div class=\"dt-tile-body\">\n          <div class=\"dt-tile-label\">Daily &amp; weekly<\u002Fdiv>\n          <div class=\"dt-tile-title\">Operating System<\u002Fdiv>\n          <div class=\"dt-tile-desc\">The rhythm that keeps CREATE alive — every shift, every Monday, every Friday.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"dt-tile\" href=\"#check\" data-target=\"check\">\n        <span class=\"lbadge lg\">BC<\u002Fspan>\n        <div class=\"dt-tile-body\">\n          <div class=\"dt-tile-label\">Friday check-in<\u002Fdiv>\n          <div class=\"dt-tile-title\">Behaviour Check<\u002Fdiv>\n          <div class=\"dt-tile-desc\">End-of-week traffic light per CREATE step — names next week's focus for you.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"overview-group-label\">Reach For It · Reference packs<\u002Fdiv>\n    <div class=\"overview-tiles\" style=\"grid-template-columns: 1fr 1fr;\">\n      <a class=\"dt-tile\" href=\"#scoreboards\" data-target=\"scoreboards\">\n        <span class=\"lbadge lg\">S<\u002Fspan>\n        <div class=\"dt-tile-body\">\n          <div class=\"dt-tile-label\">12 Scoreboards · 6 Steps<\u002Fdiv>\n          <div class=\"dt-tile-title\">Scoreboard Ideas<\u002Fdiv>\n          <div class=\"dt-tile-desc\">One metric. One week. CREATE made visible — rotate through 12 scoreboards across the full framework.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"dt-tile\" href=\"#nudges\" data-target=\"nudges\">\n        <span class=\"lbadge lg\">N<\u002Fspan>\n        <div class=\"dt-tile-body\">\n          <div class=\"dt-tile-label\">90 Nudges · 6 Steps<\u002Fdiv>\n          <div class=\"dt-tile-title\">WhatsApp Nudges<\u002Fdiv>\n          <div class=\"dt-tile-desc\">One message. One behaviour. Every morning. 15 nudges per CREATE step — 90 mornings without an extra meeting.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <aside class=\"rule\" style=\"margin-top: 8px;\">\n      <div class=\"rule-label\">Reminder<\u002Fdiv>\n      <p>Pick the tool that fits the week you're in. The whole point is to keep CREATE simple enough to actually run.<\u002Fp>\n    <\u002Faside>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════\n     LAUNCH SCRIPT\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"script\">\n  <header class=\"hero\" data-screen-label=\"Launch Script Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards · 15-Minute Session<\u002Fdiv>\n    <h1 class=\"hero-title\">Launch<br>Script<\u002Fh1>\n    <p class=\"hero-sub\">Seven steps. Fifteen minutes. Everyone leaves the room with CREATE running.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <section class=\"intro\">\n      <h3>How to run this session<\u002Fh3>\n      <p>Block 15 minutes with the team. Work through the seven steps in order. The script tells you what to say — read it out, in your own words if you prefer. By the end, the team will have picked two reinforcement techniques and you'll have them running before anyone leaves the room.<\u002Fp>\n      <p>Click each step to expand it. Time codes are guides, not stopwatches.<\u002Fp>\n    <\u002Fsection>\n\n    <aside class=\"rule\">\n      <div class=\"rule-label\">The Rule<\u002Fdiv>\n      <p>Both reinforcement techniques activated before anyone leaves the room. No \"we'll start it tomorrow.\"<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"script-list\">\n\n      <details class=\"script-step\" open=\"\" data-screen-label=\"Step 1 — Open\">\n        <summary>\n          <div class=\"step-num\">1<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Open<\u002Fdiv><div class=\"step-time\">0:00 — 0:45<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Right, so — you've all seen the trailer, you've heard the presentation. You know what CREATE is. Today's a bit different. We're not going over it again in fine detail. We're just going to make it real. Six things. Every customer. Every time. That's it.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 2 — Six Non-Negotiables\">\n        <summary>\n          <div class=\"step-num\">2<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Six Non-Negotiables<\u002Fdiv><div class=\"step-time\">0:45 — 2:45<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"delivery-note\"><strong>Delivery Note<\u002Fstrong>Walk through each one. Pause after each. Let them land.<\u002Fdiv>\n          <div class=\"nn-list\">\n            <div class=\"nn-row\"><span class=\"lbadge\">C<\u002Fspan><div><div class=\"nn-step\">Connect Quickly<\u002Fdiv><div class=\"nn-phrase\">\"Welcome to Tile Depot!\" — within 30 seconds, every customer.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"nn-row\"><span class=\"lbadge\">R<\u002Fspan><div><div class=\"nn-step\">Really Listen<\u002Fdiv><div class=\"nn-phrase\">\"Tell me about the project you're working on.\" — every engagement.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"nn-row\"><span class=\"lbadge\">E<\u002Fspan><div><div class=\"nn-step\">Explain Simply<\u002Fdiv><div class=\"nn-phrase\">Always translate technical terms into plain benefit language.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"nn-row\"><span class=\"lbadge\">A<\u002Fspan><div><div class=\"nn-step\">Add Value<\u002Fdiv><div class=\"nn-phrase\">All quotes via the website quote function.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"nn-row\"><span class=\"lbadge\">T<\u002Fspan><div><div class=\"nn-step\">Take Responsibility<\u002Fdiv><div class=\"nn-phrase\">Full quote read-back — name, size, quantity, availability, guarantee.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"nn-row\"><span class=\"lbadge\">E<\u002Fspan><div><div class=\"nn-step\">End Memorably<\u002Fdiv><div class=\"nn-phrase\">Thank by name, reference their project, invite them back.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"These six are not suggestions. They are the standard. Every customer. Every time. If you're ever unsure what to do next — come back to these.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 3 — Why It Matters\">\n        <summary>\n          <div class=\"step-num\">3<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Why It Matters<\u002Fdiv><div class=\"step-time\">2:45 — 3:30<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Here's the thing. Customers don't walk out remembering which tile had which spec. They remember whether they felt looked after. Whether someone actually listened to them. Whether they left feeling good about their decision.\"<\u002Fdiv>\n            <div class=\"say-text\">\"We sell pretty much the same stuff as everyone else. What we can do differently is how we make people feel when they're in our store. These six standards are how we do that consistently — not just on a good day, but every day.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 4 — Training Pathways\">\n        <summary>\n          <div class=\"step-num\">4<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Training Pathways<\u002Fdiv><div class=\"step-time\">3:30 — 5:00<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"pathway-grid\">\n            <div class=\"pathway-card\">\n              <h4>Training Portal<\u002Fh4>\n              <ul><li>One module per CREATE step<\u002Fli><li>Self-paced, online<\u002Fli><li>Tracked across all stores<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n            <div class=\"pathway-card\">\n              <h4>Micro Installs<\u002Fh4>\n              <ul><li>5-min weekly huddle<\u002Fli><li>One behaviour per week<\u002Fli><li>Cycles all six steps<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Today is the start, not the finish. You'll have Training Portal modules — one per CREATE step. And every week I'll run a five-minute micro install. One behaviour. One standard. Every week.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 5 — Choose Your Weapon\">\n        <summary>\n          <div class=\"step-num\">5<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Choose Your Weapon<\u002Fdiv><div class=\"step-time\">5:00 — 9:00<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"delivery-note\"><strong>Delivery Note<\u002Fstrong>Introduce each option. Read out what's under each \"Manager describes it.\" Then ask the team to pick two. Don't push a preference — let them choose.<\u002Fdiv>\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Okay, so we've got five options for how we keep CREATE going after today. Have a listen, and we'll pick two that feel right for us.\"<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"weapon-list\">\n            <div class=\"weapon\">\n              <div class=\"weapon-n\">1<\u002Fdiv>\n              <div>\n                <div class=\"weapon-nm\">The Shift Starter Card<\u002Fdiv>\n                <div class=\"weapon-ds\">\"This one's simple. There's a laminated card that sits at the counter. Each week I'll flip it to one CREATE standard — that's the one we're focused on for the week. Nothing fancy, just a reminder of what we're working on.\"<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How it works<\u002Fstrong>Each week the manager picks the focus behaviour and turns the card to that standard. It stays visible at the counter all week. At the end of each shift, give a quick nod to anyone you saw nailing it.<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How to run it<\u002Fstrong>Arrive before the team. Pick this week's standard. Flip the card. During shifts, watch for that one behaviour. At the end of each shift, mention it — even just \"Good work on the greetings today.\" Thirty seconds is enough.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"weapon\">\n              <div class=\"weapon-n\">2<\u002Fdiv>\n              <div>\n                <div class=\"weapon-nm\">The Floor Walk<\u002Fdiv>\n                <div class=\"weapon-ds\">\"Once a shift I'll do a quick lap — maybe five minutes. I'm not checking up on anyone. I'm just looking for someone doing CREATE well. When I see it, I'll say so. Out loud, in front of the team.\"<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How it works<\u002Fstrong>Pick a time each shift — usually mid-morning or just after lunch — and do a deliberate walk through the floor. Watch for one CREATE behaviour. When you see it done well, call it out publicly.<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How to run it<\u002Fstrong>Set a phone reminder so it actually happens. Pick one behaviour to watch for that shift. When you see it: \"Just noticed how you handled that customer — that's exactly what we're after.\" Keep it natural.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"weapon\">\n              <div class=\"weapon-n\">3<\u002Fdiv>\n              <div>\n                <div class=\"weapon-nm\">The Customer Story Debrief<\u002Fdiv>\n                <div class=\"weapon-ds\">\"At the end of a shift — or at the start of the next one — one person shares a real customer interaction. Just a story. Something that happened. I'll tie it back to CREATE. No performance, no roleplay.\"<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How it works<\u002Fstrong>One team member shares a real interaction — good, ordinary, or one that didn't quite land. The manager listens, then maps one part of it back to a CREATE standard. Two minutes, not a debrief session.<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How to run it<\u002Fstrong>Nominate who goes first before you leave today. Agree on when — end of shift or start of the next. Keep it low-key. Pick one CREATE moment from what they share and name it: \"That right there — that's Explain Simply. Well done.\" Rotate who shares each time.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"weapon\">\n              <div class=\"weapon-n\">4<\u002Fdiv>\n              <div>\n                <div class=\"weapon-nm\">The WhatsApp Nudge<\u002Fdiv>\n                <div class=\"weapon-ds\">\"Every morning I send one message to the group chat. One sentence. One CREATE behaviour. Done in ten seconds. Just keeps it front of mind without adding any meetings.\"<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How it works<\u002Fstrong>One focused message to the store WhatsApp group each morning before shift. One behaviour, one prompt, nothing more. Over time it builds a rhythm — staff start to expect it.<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How to run it<\u002Fstrong>Send it before the first staff member starts. Keep it to one sentence. Don't have time to write one? Jump to the <a href=\"#nudges\" data-target=\"nudges\" style=\"color: var(--td-green); font-weight: 700;\">90 WhatsApp Nudges<\u002Fa> pack and pull one straight out of the list.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"weapon\">\n              <div class=\"weapon-n\">5<\u002Fdiv>\n              <div>\n                <div class=\"weapon-nm\">The Scoreboard<\u002Fdiv>\n                <div class=\"weapon-ds\">\"We put one number on the whiteboard and track it for the week. Something simple — like how many website quotes we did, or how many greetings landed. It's not a competition. It just makes CREATE visible.\"<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How it works<\u002Fstrong>Pick one measurable CREATE behaviour and track it on a whiteboard or printed sheet the whole team can see. Numbers on a wall change behaviour without anyone needing to say a word.<\u002Fdiv>\n                <div class=\"delivery-note\"><strong>How to run it<\u002Fstrong>Pick one metric — keep it simple and countable. Stuck for ideas? Jump to the <a href=\"#scoreboards\" data-target=\"scoreboards\" style=\"color: var(--td-green); font-weight: 700;\">12 Scoreboard Ideas<\u002Fa> pack and pick one. Write it up before the team arrives.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"say-this\" style=\"margin-top: 14px;\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Right — which two feel right for us? Have a think. You know your store better than anyone.\"<\u002Fdiv>\n            <div class=\"say-text\">[Let the team respond. If there's a split, the manager decides.]<\u002Fdiv>\n            <div class=\"say-text\">\"Good. We're going with [X] and [Y]. I'll run both. Starting this week.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 6 — Set It Up\">\n        <summary>\n          <div class=\"step-num\">6<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Set It Up<\u002Fdiv><div class=\"step-time\">9:00 — 13:00<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"delivery-note\"><strong>Delivery Note<\u002Fstrong>Both techniques activated before anyone leaves the room.<\u002Fdiv>\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"Before we finish, we're getting both of these up and running right now. Not tomorrow. Now.\"<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"setup-list\">\n            <div class=\"setup-item\"><div class=\"setup-label\">Option 1 — Shift Starter Card<\u002Fdiv><div class=\"setup-text\">Flip the Shift Starter Card to this week's CREATE standard. Tell the team out loud what this week's focus is. Done.<\u002Fdiv><\u002Fdiv>\n            <div class=\"setup-item\"><div class=\"setup-label\">Option 2 — Floor Walk<\u002Fdiv><div class=\"setup-text\">Set a phone reminder right now — pick a time, set it, done. Tell the team: \"I'll be doing a quick lap each shift. I'm looking for CREATE done well.\"<\u002Fdiv><\u002Fdiv>\n            <div class=\"setup-item\"><div class=\"setup-label\">Option 3 — Story Debrief<\u002Fdiv><div class=\"setup-text\">Decide who shares first — nominate someone now, don't leave it open. Agree on when: end of today's shift or start of tomorrow's.<\u002Fdiv><\u002Fdiv>\n            <div class=\"setup-item\"><div class=\"setup-label\">Option 4 — WhatsApp Nudge<\u002Fdiv><div class=\"setup-text\">Open the team group chat right now. Write and send the first nudge before this session ends — one sentence, one behaviour.<\u002Fdiv><\u002Fdiv>\n            <div class=\"setup-item\" style=\"grid-column: 1 / -1;\"><div class=\"setup-label\">Option 5 — Scoreboard<\u002Fdiv><div class=\"setup-text\">Grab a marker and go to the whiteboard now. Write this week's metric at the top. Put a zero next to it. It's live before the team leaves the room.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"script-step\" data-screen-label=\"Step 7 — Close\">\n        <summary>\n          <div class=\"step-num\">7<\u002Fdiv>\n          <div class=\"step-meta\"><div class=\"step-title\">Close<\u002Fdiv><div class=\"step-time\">13:00 — 15:00<\u002Fdiv><\u002Fdiv>\n          <div class=\"chevron\">⌄<\u002Fdiv>\n        <\u002Fsummary>\n        <div class=\"step-body\">\n          <div class=\"say-this\">\n            <div class=\"say-label\">Say This<\u002Fdiv>\n            <div class=\"say-text\">\"So — six standards, two ways to keep them going. That's the plan.\"<\u002Fdiv>\n            <div class=\"say-text\">\"Last thing before we start. Which one of those six, if you actually nailed it every single time, would make the biggest difference to the customers you deal with? Have a think.\"<\u002Fdiv>\n            <div class=\"say-text\">[Pause. Let one or two people answer. Nod. Don't over-respond.]<\u002Fdiv>\n            <div class=\"say-text\">\"Yeah. Remember that one.\"<\u002Fdiv>\n            <div class=\"say-text\">\"Your next customer is your first go at it. Off you go.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n    <\u002Fdiv><!-- /script-list -->\n\n    <div class=\"complete-card\" style=\"margin-top: 8px;\">\n      <span class=\"accent\">Session Complete<\u002Fspan>\n      <h3>Every Shop. Every Customer. Every Time.<\u002Fh3>\n      <p>Daily question: <em>Which CREATE behaviour did I reinforce today?<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════\n     OPERATING SYSTEM\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"os\">\n  <header class=\"hero\" data-screen-label=\"Operating System Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards · Daily &amp; Weekly<\u002Fdiv>\n    <h1 class=\"hero-title\">Operating<br>System<\u002Fh1>\n    <p class=\"hero-sub\">The rhythm that keeps CREATE alive after the launch — every shift, every Monday, every Friday.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <div class=\"daily-q-card\">\n      <div class=\"daily-q-label\">Ask Yourself Every Shift<\u002Fdiv>\n      <div class=\"daily-q-text\">Which CREATE behaviour did I reinforce today?<\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"intro\">\n      <h3>How to read this<\u002Fh3>\n      <p>Five rhythms make up the CREATE operating system. Three are yours alone — what you do each shift, each Monday, each Friday. The other two cycle across the whole store network: the weekly manager meeting, and the six-week micro install rotation that takes your team through every CREATE step.<\u002Fp>\n    <\u002Fsection>\n\n    <div class=\"os-grid\">\n\n      <article class=\"os-card\" data-screen-label=\"Every Shift\">\n        <div class=\"os-card-header\">\n          <div class=\"os-card-icon\"><svg><use href=\"#ic-sun\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"os-card-title\">Every Shift<\u002Fdiv>\n            <div class=\"os-card-sub\">Daily non-negotiables for managers<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"os-card-body\">\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Run your chosen <strong>reinforcement technique<\u002Fstrong> — Shift Starter Card, Floor Walk, WhatsApp Nudge, Story Debrief, or Scoreboard.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Catch one person<\u002Fstrong> doing CREATE well. Name it out loud in front of the team.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">If you hear a wrong phrase — <strong>correct it calmly and immediately.<\u002Fstrong> Reset to the standard.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"os-card\" data-screen-label=\"Every Monday\">\n        <div class=\"os-card-header\">\n          <div class=\"os-card-icon\"><svg><use href=\"#ic-cal\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"os-card-title\">Every Monday<\u002Fdiv>\n            <div class=\"os-card-sub\">Weekly Micro Install — 5 minutes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"os-card-body\">\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Name the <strong>one CREATE behaviour<\u002Fstrong> you're focusing on this week.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Demonstrate <strong>bad vs best<\u002Fstrong> — 60 seconds, no roleplay required.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Have each person <strong>say the phrase out loud once.<\u002Fstrong> That's the install.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"os-card\" data-screen-label=\"Every Friday\">\n        <div class=\"os-card-header\">\n          <div class=\"os-card-icon\"><svg><use href=\"#ic-star\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"os-card-title\">Every Friday<\u002Fdiv>\n            <div class=\"os-card-sub\">Recognition + behaviour check<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"os-card-body\">\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Call out <strong>one CREATE win<\u002Fstrong> publicly — specific behaviour, specific person.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Complete the <a href=\"#check\" data-target=\"check\" style=\"color: var(--td-green); font-weight: 700;\">Behaviour Check<\u002Fa> for the week.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Identify the <strong>lowest-scoring letter<\u002Fstrong> — that's next week's focus.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"os-card\" data-screen-label=\"Weekly Manager Meeting\">\n        <div class=\"os-card-header\">\n          <div class=\"os-card-icon\"><svg><use href=\"#ic-chart\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"os-card-title\">Weekly Manager Meeting<\u002Fdiv>\n            <div class=\"os-card-sub\">CREATE pulse — 5 minutes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"os-card-body\">\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Share <strong>one behaviour reinforced<\u002Fstrong> this week.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Share <strong>one CREATE win<\u002Fstrong> from your store.<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\">Name your <strong>focus behaviour for next week.<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"os-card\" data-screen-label=\"6-Week Micro Install Rotation\">\n        <div class=\"os-card-header\">\n          <div class=\"os-card-icon\"><svg><use href=\"#ic-rotate\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"os-card-title\">6-Week Micro Install Rotation<\u002Fdiv>\n            <div class=\"os-card-sub\">One CREATE step per week<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"os-card-body\">\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 1<\u002Fstrong> — Connect Quickly: \"Welcome to Tile Depot!\"<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 2<\u002Fstrong> — Really Listen: \"Tell me about the project…\"<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 3<\u002Fstrong> — Explain Simply: feature → benefit translation<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 4<\u002Fstrong> — Add Value: website quote function + project thinking<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 5<\u002Fstrong> — Take Responsibility: full quote read-back<\u002Fdiv><\u002Fdiv>\n          <div class=\"os-row\"><div class=\"os-dot\"><\u002Fdiv><div class=\"os-row-text\"><strong>Week 6<\u002Fstrong> — End Memorably: name + project + invitation<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n\n    <section class=\"remember\" style=\"margin-top: 8px;\">\n      <div class=\"field-label\">Remember<\u002Fdiv>\n      <p>The rhythm is the system. Miss a week and CREATE drifts; keep the rhythm and it runs itself.<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════\n     BEHAVIOUR CHECK (Friday traffic light)\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"check\">\n  <header class=\"hero\" data-screen-label=\"Behaviour Check Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards · Friday Check-In<\u002Fdiv>\n    <h1 class=\"hero-title\">Behaviour<br>Check<\u002Fh1>\n    <p class=\"hero-sub\">Five minutes on a Friday. One rating per CREATE step. Next week's focus picks itself.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <div class=\"week-display\">\n      <div class=\"week-label\">Week of<\u002Fdiv>\n      <div class=\"week-value\" id=\"weekDisplay\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"intro\">\n      <h3>How to fill this out<\u002Fh3>\n      <p>Rate each CREATE step based on what you observed across the whole team this week. <strong style=\"color: var(--go);\">Green<\u002Fstrong> = consistent and visible. <strong style=\"color: var(--amber);\">Amber<\u002Fstrong> = developing, hit and miss. <strong style=\"color: var(--red);\">Red<\u002Fstrong> = needs focus next week. Tick the specific behaviours that landed — what you don't tick tells you where to coach.<\u002Fp>\n    <\u002Fsection>\n\n    <div class=\"tl-grid\">\n\n      <article class=\"tl-card\" data-screen-label=\"C — Connect Quickly\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">C<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">Connect Quickly<\u002Fdiv>\n            <div class=\"tl-nn\">\"Welcome to Tile Depot!\" — within 30 seconds, every customer.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"C\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Customers acknowledged within 30 seconds<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Exact phrase \"Welcome to Tile Depot!\" used<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Open body language and eye contact on approach<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tl-card\" data-screen-label=\"R — Really Listen\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">R<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">Really Listen<\u002Fdiv>\n            <div class=\"tl-nn\">\"Tell me about the project you're working on.\" — every engagement.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"R\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Discovery question used before recommending<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Customer allowed to speak without interruption<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Understanding confirmed before moving to products<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tl-card\" data-screen-label=\"E — Explain Simply\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">E<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">Explain Simply<\u002Fdiv>\n            <div class=\"tl-nn\">Technical terms translated into plain benefit language.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"E1\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">No unexplained jargon used with customers<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Features explained in terms of customer benefit<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Customer visibly understood before moving on<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tl-card\" data-screen-label=\"A — Add Value\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">A<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">Add Value<\u002Fdiv>\n            <div class=\"tl-nn\">All quotes via the website quote function.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"A\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Website quote function used for all quotes<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Full project scope explored — not just tiles<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Complementary products suggested where relevant<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tl-card\" data-screen-label=\"T — Take Responsibility\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">T<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">Take Responsibility<\u002Fdiv>\n            <div class=\"tl-nn\">Full quote read-back — name, size, quantity, availability, guarantee.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"T\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Full read-back: name, size, quantity, availability, guarantee<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Issues owned personally — not passed to the manager<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Returns and guarantee mentioned on every quote<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tl-card\" data-screen-label=\"E — End Memorably\">\n        <header class=\"tl-head\">\n          <span class=\"lbadge lg\">E<\u002Fspan>\n          <div>\n            <div class=\"tl-step-name\">End Memorably<\u002Fdiv>\n            <div class=\"tl-nn\">Thank by name, reference their project, invite them back.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"tl-body\">\n          <div class=\"tl-rating-col\">\n            <div class=\"tl-label\">This Week's Rating<\u002Fdiv>\n            <div class=\"tl-buttons\" data-letter=\"E2\">\n              <button class=\"tl-btn green\" data-colour=\"green\">Green<\u002Fbutton>\n              <button class=\"tl-btn amber\" data-colour=\"amber\">Amber<\u002Fbutton>\n              <button class=\"tl-btn red\" data-colour=\"red\">Red<\u002Fbutton>\n
