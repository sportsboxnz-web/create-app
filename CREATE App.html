            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tl-beh-col\">\n            <div class=\"tl-label\">Observed Behaviours<\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Customer thanked by name where known<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Specific project referenced in the farewell<\u002Fdiv><\u002Fdiv>\n            <div class=\"tl-beh-item\"><div class=\"tl-check\" data-check=\"\">✓<\u002Fdiv><div class=\"tl-beh-text\">Invitation to return or follow-up included<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n\n    <div class=\"tl-summary\">\n      <div class=\"tl-summary-head\">Weekly Summary<\u002Fdiv>\n      <div class=\"tl-summary-body\" id=\"summaryBody\">\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">C — Connect Quickly<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-C\">–<\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">R — Really Listen<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-R\">–<\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">E — Explain Simply<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-E1\">–<\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">A — Add Value<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-A\">–<\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">T — Take Responsibility<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-T\">–<\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-summary-row\"><div class=\"tl-summary-step\">E — End Memorably<\u002Fdiv><div class=\"tl-summary-dot\" id=\"sum-E2\">–<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-actions\">\n        <button class=\"tl-action-btn secondary\" id=\"resetCheck\">Reset<\u002Fbutton>\n        <button class=\"tl-action-btn primary\" id=\"saveCheck\">Save This Week<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"remember\" style=\"margin-top: 4px;\">\n      <div class=\"field-label\">Remember<\u002Fdiv>\n      <p>The lowest-scoring letter is next week's focus. That's the whole point — Friday hands Monday a job.<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════\n     SCOREBOARDS\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"scoreboards\">\n  <header class=\"hero\" data-screen-label=\"Scoreboard Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards<\u002Fdiv>\n    <h1 class=\"hero-title\">12 Scoreboard<br>Ideas<\u002Fh1>\n    <p class=\"hero-sub\">One metric. One week. CREATE made visible.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <section class=\"intro\">\n      <h3>How to use this pack<\u002Fh3>\n      <p>Pick one scoreboard per week. Write the metric on the whiteboard before the team arrives. Update it daily. Review it briefly on Friday. Change it the following week.<\u002Fp>\n      <p>Two scoreboards per CREATE step — so you can rotate through the full framework in 12 weeks, or pick the ones most relevant to what you're seeing in your store right now.<\u002Fp>\n      <p>Numbers on a wall change behaviour without anyone needing to say a word.<\u002Fp>\n    <\u002Fsection>\n\n    <aside class=\"rule\">\n      <div class=\"rule-label\">The Rule<\u002Fdiv>\n      <p>One metric only. Keep it simple and countable. A rough tally is better than a precise number you never update.<\u002Fp>\n    <\u002Faside>\n\n    <section class=\"glance\">\n      <div class=\"glance-head\"><h3>At a Glance<\u002Fh3><div class=\"count\">12 Scoreboards<\u002Fdiv><\u002Fdiv>\n      <table>\n        <thead><tr><th class=\"num\">#<\u002Fth><th class=\"letter-cell\">Letter<\u002Fth><th>Step &amp; Scoreboard<\u002Fth><th class=\"type-cell\">Metric Type<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"num\">01<\u002Ftd><td><span class=\"lbadge\">C<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Connect Quickly<\u002Fspan> · 30-Second Greeting Tally<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">02<\u002Ftd><td><span class=\"lbadge\">C<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Connect Quickly<\u002Fspan> · First Customer Response Time<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Timed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">03<\u002Ftd><td><span class=\"lbadge\">R<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Really Listen<\u002Fspan> · Discovery Question Tracker<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">04<\u002Ftd><td><span class=\"lbadge\">R<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Really Listen<\u002Fspan> · Project Confirmed Counter<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">05<\u002Ftd><td><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Explain Simply<\u002Fspan> · Plain Language Wins<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">06<\u002Ftd><td><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Explain Simply<\u002Fspan> · Three Options Rule<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">07<\u002Ftd><td><span class=\"lbadge\">A<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Add Value<\u002Fspan> · Website Quote Counter<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">System / Tally<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">08<\u002Ftd><td><span class=\"lbadge\">A<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Add Value<\u002Fspan> · Full Project Conversations<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">09<\u002Ftd><td><span class=\"lbadge\">T<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Take Responsibility<\u002Fspan> · Quote Read-Back Tracker<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">10<\u002Ftd><td><span class=\"lbadge\">T<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Take Responsibility<\u002Fspan> · Guarantee Mentions<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Self-reported<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">11<\u002Ftd><td><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">End Memorably<\u002Fspan> · Personalised Goodbye Counter<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Observed<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">12<\u002Ftd><td><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">End Memorably<\u002Fspan> · Come Back Invitations<\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Self-reported<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fsection>\n\n    <div class=\"step-divider\" data-screen-label=\"C — Connect Quickly\">\n      <span class=\"lbadge lg\">C<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">Connect Quickly<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>\"Welcome to Tile Depot!\" — within 30 seconds, every customer.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">C<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 01<\u002Fdiv><div class=\"head-title\">The 30-Second Greeting Tally<\u002Fdiv><div class=\"head-step\">Connect Quickly<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of customers greeted within 30 seconds this shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Manager or nominated team member tallies every greeting observed on the floor during each shift. A simple tick on the whiteboard per greeting. Total it at end of shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Greetings within 30 seconds today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We landed [X] greetings this week. Every single one of those customers felt welcomed the moment they walked in. Next week, let's see if we can keep every shift above [Y].\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The greeting is the easiest CREATE behaviour to observe and the fastest to drift. Making it visible resets the standard without anyone needing to say a word.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Don't count greetings that miss the 30-second window — only tally the ones done right. Accuracy matters more than a high number.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">C<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 02<\u002Fdiv><div class=\"head-title\">First Customer Response Time<\u002Fdiv><div class=\"head-step\">Connect Quickly<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">How long before the first customer of the day was acknowledged.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Manager notes the time the first customer enters and the time they were greeted. Track this each morning for the week — record the gap in seconds on the board.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">First greeting today: ______ seconds after customer entered<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"Our average first response this week was [X] seconds. That's [better than / the same as] last week. We're aiming to keep it under 30 seconds every morning.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The opening of the day sets the standard for the shift. Tracking it creates accountability from the first minute the door opens.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>This one is quick to run — one observation per morning. It takes 30 seconds of manager attention to make a visible point to the whole team.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div class=\"step-divider\" data-screen-label=\"R — Really Listen\">\n      <span class=\"lbadge lg\">R<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">Really Listen<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>\"Tell me about the project you're working on.\" — every engagement.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">R<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 03<\u002Fdiv><div class=\"head-title\">Discovery Question Tracker<\u002Fdiv><div class=\"head-step\">Really Listen<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of times the project discovery question was used this shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Manager listens for the exact phrase <em>\"Tell me about the project you're working on\"<\u002Fem> during floor walks. Tally each time it's used correctly. One tally mark per interaction observed.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Discovery questions asked today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We asked the discovery question [X] times this week across the interactions I observed. That means [X] customers felt heard before we recommended anything. Let's make it automatic.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Advice given before listening feels like a sales pitch. Tracking the discovery question makes listening a visible, measurable behaviour — not just an expectation.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Only count the exact phrase or a clear equivalent — not \"Can I help you.\" The specificity is the point.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">R<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 04<\u002Fdiv><div class=\"head-title\">Project Confirmed Counter<\u002Fdiv><div class=\"head-step\">Really Listen<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of interactions where the team member confirmed understanding before recommending.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">During floor walks, listen for the confirmation step — <em>\"So if I've got this right…\"<\u002Fem> or <em>\"Just to confirm…\"<\u002Fem> Tally each time a team member reflects back what they've heard before moving to products.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Confirmations before recommendations today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We confirmed understanding [X] times before making recommendations this week. That's [X] customers who felt properly listened to. Next week let's make it a habit, not a highlight.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Most staff ask the discovery question but skip the confirmation. Tracking confirmation closes the loop — it proves the listening actually happened.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>This one's slightly harder to observe than the greeting. Use it in weeks when you're doing regular floor walks and can listen to full interactions.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div class=\"step-divider\" data-screen-label=\"E — Explain Simply\">\n      <span class=\"lbadge lg\">E<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">Explain Simply<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Always translate technical terms into plain benefit language.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">E<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 05<\u002Fdiv><div class=\"head-title\">Plain Language Wins<\u002Fdiv><div class=\"head-step\">Explain Simply<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of times a technical term was translated into plain language this shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">During floor observations, listen for the translation moment — <em>\"[term], which means [benefit].\"<\u002Fem> Tally each time a team member explains a feature in customer-friendly language unprompted.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Plain language explanations today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We caught [X] plain language moments this week. Each one of those customers left feeling confident rather than confused. Confusion delays decisions — clarity closes them.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Technical dumping is the default for people who know their product well. Making plain language visible rewards the habit of translating specs into benefits.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Praise specific examples in your Friday call-out — name the team member and what they said. This scoreboard works best paired with the Floor Walk weapon.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">E<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 06<\u002Fdiv><div class=\"head-title\">Three Options Rule<\u002Fdiv><div class=\"head-step\">Explain Simply<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of interactions where the team member offered two or three options — not more.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Observe product selection conversations. Tally each time a team member narrows choice to two or three clear options with a recommendation, rather than showing an overwhelming range.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Curated options presented today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We gave customers a curated choice [X] times this week. Fewer options, better decisions. Next week let's make sure every product conversation ends with a clear recommendation.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Showing 20 options creates decision fatigue. Two or three curated choices with a recommendation builds customer confidence and shortens the sales cycle.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>This is a coaching signal too — if the number is low, run a quick Bad vs Best demo in Monday's micro install showing the difference between overwhelming and curating.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div class=\"step-divider\" data-screen-label=\"A — Add Value\">\n      <span class=\"lbadge lg\">A<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">Add Value<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>All quotes must be generated using the website quote function.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">A<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 07<\u002Fdiv><div class=\"head-title\">Website Quote Counter<\u002Fdiv><div class=\"head-step\">Add Value<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of website quotes generated this shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Simple tally of quotes generated through the Azul website quote function each shift. Count is pulled from the system at end of day or tallied manually as quotes are created.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Website quotes generated today: ______ &nbsp;|&nbsp; Week total: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We generated [X] website quotes this week. Every one of those customers left with a professional, visual quote they can share with their partner, builder, or family. That's [X] chances to win the sale after they leave.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The website quote is the single most trackable Add Value behaviour. It either happened or it didn't. Zero tolerance for manual quotes starts with making the number visible.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>This is the strongest scoreboard for Add Value — run it any time you see manual quotes creeping back in. The number on the board speaks louder than any conversation.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">A<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 08<\u002Fdiv><div class=\"head-title\">Full Project Conversations<\u002Fdiv><div class=\"head-step\">Add Value<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of interactions where a complementary product or category was mentioned.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">During floor walks and counter observations, tally each time a team member proactively mentions bathware, laminate, maintenance products, trade supplies, or any category beyond what the customer asked for.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Full project conversations today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We had [X] full project conversations this week — customers who heard about more than just what they came in for. That's [X] opportunities to be their one stop shop.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Most customers don't know the full range Tile Depot carries. Tracking full project conversations builds the habit of thinking beyond the immediate request.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Pair this with a Monday micro install — spend two minutes showing the team how to bridge from tiles to bathware naturally: <em>\"Since you're doing the whole bathroom, have you thought about your vanity?\"<\u002Fem><\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div class=\"step-divider\" data-screen-label=\"T — Take Responsibility\">\n      <span class=\"lbadge lg\">T<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">Take Responsibility<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Full quote read-back — name, size, details, quantity, availability, guarantee.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">T<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 09<\u002Fdiv><div class=\"head-title\">Quote Read-Back Tracker<\u002Fdiv><div class=\"head-step\">Take Responsibility<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of complete quote read-backs performed at the counter this shift.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Manager or senior team member observes counter interactions. Tally each time a full read-back is completed — tile name, size, details, quantity, availability, and guarantee all mentioned before the customer leaves.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Complete read-backs today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We completed [X] full read-backs this week. Every one of those is a potential error caught before installation day. Next week let's make sure the number matches the number of quotes processed.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The read-back is the most frequently skipped non-negotiable. Tracking it makes the skipping visible without the manager having to say anything directly.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Compare this number to the website quote count — ideally they should be similar. A big gap between quotes generated and read-backs completed tells you exactly where to focus coaching.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">T<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 10<\u002Fdiv><div class=\"head-title\">Guarantee Mentions<\u002Fdiv><div class=\"head-step\">Take Responsibility<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of times the 10-year guarantee was mentioned during a quote or counter interaction.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Tally each time a team member mentions the 10-year quality guarantee during a counter interaction. Can be self-reported at end of shift or observed during floor walks.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Guarantee mentions today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We mentioned the guarantee [X] times this week. Every customer who heard it left with one less reason to shop elsewhere. The guarantee removes purchase anxiety — use it.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The guarantee is a genuine differentiator and a confidence builder for uncertain customers. Tracking it turns it from background knowledge into an active sales tool.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>This one works well as a self-reported scoreboard — ask team members to tally their own mentions at end of shift. It builds self-awareness without feeling like surveillance.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div class=\"step-divider\" data-screen-label=\"E — End Memorably\">\n      <span class=\"lbadge lg\">E<\u002Fspan>\n      <div class=\"meta\">\n        <div class=\"step-name\">End Memorably<\u002Fdiv>\n        <p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Always thank by name, reference their project, and invite them back.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">E<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 11<\u002Fdiv><div class=\"head-title\">Personalised Goodbye Counter<\u002Fdiv><div class=\"head-step\">End Memorably<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of closing interactions that included the customer's name or a project reference.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">During floor walks near the counter, listen for the close. Tally each time a team member references the customer's project, uses their name, or issues a genuine invitation to return — rather than a generic <em>\"Thanks, have a good day.\"<\u002Fem><\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Memorable closings today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We gave [X] personalised goodbyes this week. Those customers didn't just have a transaction — they had an experience. That's what brings them back and what they tell their friends about.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>The close is the last thing a customer remembers. Research shows endings disproportionately shape the overall memory of an experience. Making memorable closes visible raises the standard without a lecture.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>At Friday's recognition moment, share one specific closing line a team member used this week — quoting it exactly. Real examples spread faster than instructions.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"detail\">\n      <header class=\"detail-head\">\n        <span class=\"lbadge lg\">E<\u002Fspan>\n        <div class=\"head-meta\"><div class=\"head-num\">Scoreboard 12<\u002Fdiv><div class=\"head-title\">Come Back Invitations<\u002Fdiv><div class=\"head-step\">End Memorably<\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"detail-body\">\n        <div class=\"field\"><div class=\"field-label\">What you track<\u002Fdiv><p class=\"field-value\">Number of times a customer was specifically invited to return or show photos of their finished project.<\u002Fp><\u002Fdiv>\n        <div class=\"field\"><div class=\"field-label\">How to track it<\u002Fdiv><p class=\"field-value\">Tally each time a team member closes with a genuine invitation — <em>\"Come back and show us how it turned out\"<\u002Fem> or <em>\"Let us know how the installation goes.\"<\u002Fem> Self-reported at end of shift works well for this one.<\u002Fp><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Write on the board<\u002Fdiv><div class=\"board-line\">Return invitations today: ______<\u002Fdiv><\u002Fdiv>\n        <div class=\"field wide\"><div class=\"field-label\">Friday review<\u002Fdiv><div class=\"friday\">\"We invited [X] customers back this week. That's not a sales tactic — it's genuine interest in their project. Customers who feel cared for beyond the transaction become the customers who refer their friends.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"subnote-row\">\n        <div class=\"subnote\"><div class=\"field-label\">Why it works<\u002Fdiv><p>Inviting customers back signals care rather than transaction. It's the simplest way to turn a one-time purchase into a long-term relationship — and it costs nothing.<\u002Fp><\u002Fdiv>\n        <div class=\"subnote\"><div class=\"field-label\">Manager tip<\u002Fdiv><p>Run this scoreboard in a week where you're also using the WhatsApp Nudge on End Memorably — the two reinforce each other and you'll see the number climb by mid-week.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <section class=\"closing\">\n      <div class=\"line\">12 weeks.<\u002Fdiv>\n      <div class=\"line\">One metric at a time.<\u002Fdiv>\n      <div class=\"line\">CREATE made visible.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"rhythm\">\n      <h3>The Weekly Rhythm<\u002Fh3>\n      <dl>\n        <div><dt>Monday<\u002Fdt><dd>Write the metric on the board before the team arrives.<\u002Fdd><\u002Fdiv>\n        <div><dt>Daily<\u002Fdt><dd>Update the tally — even a rough number is fine.<\u002Fdd><\u002Fdiv>\n        <div><dt>Friday<\u002Fdt><dd>Review it in one sentence. Name a win. Set next week's direction.<\u002Fdd><\u002Fdiv>\n        <div><dt>Following Monday<\u002Fdt><dd>Change the metric. Keep it moving.<\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n    <\u002Fsection>\n\n    <section class=\"remember\">\n      <div class=\"field-label\">Remember<\u002Fdiv>\n      <p>It's not a competition. It's not surveillance. It's CREATE made visible.<\u002Fp>\n      <p>Numbers on a wall change behaviour without anyone needing to say a word.<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════\n     NUDGES\n════════════════════════════════════════════════════ -->\n<section class=\"page doc-section\" id=\"nudges\">\n  <header class=\"hero\" data-screen-label=\"Nudges Hero\">\n    <div class=\"td-logo\" aria-label=\"Tile Depot\">\n      <span class=\"td-tile\">TILE<\u002Fspan>\n      <span class=\"td-depot\">DEPOT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">CREATE Standards<\u002Fdiv>\n    <h1 class=\"hero-title\">90 WhatsApp<br>Nudges<\u002Fh1>\n    <p class=\"hero-sub\">One message. One behaviour. Every morning.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"body\">\n\n    <section class=\"intro\">\n      <h3>How to use these nudges<\u002Fh3>\n      <p>Send one message to the store WhatsApp group each morning before the first shift starts. One sentence only. Pick the nudge that fits what you're seeing in your store that week — you don't need to go in order.<\u002Fp>\n      <p>15 nudges per CREATE step. 6 steps. 90 mornings of CREATE kept alive without a single extra meeting.<\u002Fp>\n    <\u002Fsection>\n\n    <aside class=\"rule\">\n      <div class=\"rule-label\">The Rule<\u002Fdiv>\n      <p>Short is better. One sentence. Done in ten seconds. The rhythm matters more than the wording.<\u002Fp>\n    <\u002Faside>\n\n    <section class=\"glance\">\n      <div class=\"glance-head\"><h3>At a Glance<\u002Fh3><div class=\"count\">90 Nudges · 6 Steps<\u002Fdiv><\u002Fdiv>\n      <table>\n        <thead><tr><th class=\"letter-cell\">Step<\u002Fth><th>Standard<\u002Fth><th class=\"type-cell\">Nudges<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">C<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Connect Quickly<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 1 – 15<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">R<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Really Listen<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 16 – 30<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Explain Simply<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 31 – 45<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">A<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Add Value<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 46 – 60<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">T<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">Take Responsibility<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 61 – 75<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"letter-cell\"><span class=\"lbadge\">E<\u002Fspan><\u002Ftd><td><span class=\"step-cell\">End Memorably<\u002Fspan><\u002Ftd><td class=\"type-cell\"><span class=\"type-pill\">Days 76 – 90<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fsection>\n\n    <div class=\"step-divider\" data-screen-label=\"C — Connect Quickly\">\n      <span class=\"lbadge lg\">C<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">Connect Quickly<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>\"Welcome to Tile Depot!\" — within 30 seconds, every customer.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">01<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>the first words every customer hears are <em>Welcome to Tile Depot<\u002Fem> — no exceptions.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">02<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>eye contact and a smile before you say a word — then <em>Welcome to Tile Depot<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">03<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>if a customer has been in the store 30 seconds without a greeting, that's too long.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">04<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>even when you're busy with someone else, look up, smile, and say <em>Welcome to Tile Depot<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">05<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>greet every customer like they're the first one through the door today.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">06<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>don't wait for them to come to you — move toward the customer within 30 seconds.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">07<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the greeting sets the tone for the whole interaction — make it count.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">08<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>no one leaves without hearing <em>Welcome to Tile Depot<\u002Fem> at the start.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">09<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>open body language, eye contact, then the greeting — all three, every time.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">10<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>invisible customers don't buy — make sure everyone feels seen within 30 seconds.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">11<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>if you're on the phone or with someone, still acknowledge a customer who walks in.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">12<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>your greeting is the first impression — make it warm, genuine, and on brand.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">13<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan><em>Can I help you<\u002Fem> is not our greeting — <em>Welcome to Tile Depot<\u002Fem> is.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">14<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>the customer is watching from the moment they walk in — don't make them wait.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">15<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did every customer today hear <em>Welcome to Tile Depot<\u002Fem> within 30 seconds?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · Connect Quickly<\u002Fdiv>\n      <p>Use these nudges in Week 1 of your micro install rotation, or whenever you notice greetings slipping. The greeting is the easiest behaviour to observe — listen for it during your floor walk.<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"step-divider\" data-screen-label=\"R — Really Listen\">\n      <span class=\"lbadge lg\">R<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">Really Listen<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>\"Tell me about the project you're working on.\" — every engagement.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">16<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>before you recommend anything, ask — <em>Tell me about the project you're working on<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">17<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>listen 70% of the time, talk 30% — customers need to feel heard before they feel helped.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">18<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>don't assume what they need — ask the project question and let them tell you.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">19<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>slow down. Ask the discovery question. The right recommendation comes after you've listened.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">20<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>confirm what you've heard before you move to products — repeat it back to them.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">21<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan><em>What are you looking for<\u002Fem> is not our question — <em>Tell me about the project you're working on<\u002Fem> is.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">22<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the more a customer talks, the better your advice will be — ask and listen.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">23<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>resist the urge to jump to solutions — let them finish before you respond.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">24<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>if you can't repeat back their project goals, you haven't really listened yet.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">25<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>questions build trust faster than answers — ask before you advise.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">26<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>first-time renovators are nervous — the discovery question gives them permission to explain.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">27<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>great advice given too early feels pushy — earn the recommendation by listening first.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">28<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>every customer has a story — <em>Tell me about the project<\u002Fem> opens it up.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">29<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>don't interrupt. Let them finish. Then confirm what you heard before you move on.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">30<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did you ask <em>Tell me about the project you're working on<\u002Fem> with every customer?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · Really Listen<\u002Fdiv>\n      <p>Use these nudges when you notice staff jumping to products too quickly. Pair with the Customer Story Debrief — ask the team to share a moment where they really listened and what they found out.<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"step-divider\" data-screen-label=\"E — Explain Simply\">\n      <span class=\"lbadge lg\">E<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">Explain Simply<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Always translate technical terms into plain benefit language.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">31<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>every technical term you use needs a plain English follow-up — what does it mean for them?<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">32<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>if a 12-year-old wouldn't understand your explanation, simplify it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">33<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>confused customers don't buy — clarity builds confidence and confidence closes sales.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">34<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>don't say <em>PEI rating<\u002Fem> — say <em>it's tough enough for a busy family bathroom<\u002Fem> and leave it at that.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">35<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>translate features into feelings — not what the tile is, but what it does for their space.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">36<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>use the rule of three — offer two or three options max, explain each one simply.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">37<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>customers aren't tile experts — that's why they're talking to you. Speak their language.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">38<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>instead of specs, tell them what they'll experience — durable, easy to clean, slip resistant.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">39<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>don't list features — paint a picture of what their finished space will look and feel like.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">40<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>if a customer goes quiet mid-explanation, stop and check — <em>does that make sense?<\u002Fem><\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">41<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>use samples and let them touch — explanation sticks better when customers can feel the difference.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">42<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan><em>rectified<\u002Fem> doesn't mean anything to most customers — <em>modern look with thinner grout lines<\u002Fem> does.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">43<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>match your language to the customer — a builder talks differently to a first-time renovator.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">44<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>if you're explaining what something is, always follow with why it matters for their project.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">45<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did every customer leave clearly understanding what they were buying and why?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · Explain Simply<\u002Fdiv>\n      <p>Use these nudges when customers are looking confused or overwhelmed on the floor. A good nudge week is when you hear staff explaining things in plain language without being prompted.<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"step-divider\" data-screen-label=\"A — Add Value\">\n      <span class=\"lbadge lg\">A<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">Add Value<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>All quotes must be generated using the website quote function.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">46<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>every quote goes through the website quote function — no exceptions, no shortcuts.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">47<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>a website quote with images is what sets us apart from a competitor's handwritten note.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">48<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>before you finalise any quote, ask — have we thought about grout, sealer, and adhesive?<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">49<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>think full project, not just tiles — have they considered maintenance products, fixtures, laminate?<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">50<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>the website quote does the work for you — it keeps Tile Depot top of mind long after they leave.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">51<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>add-ons aren't upselling — they're protecting the customer's investment and saving them a trip.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">52<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>if a customer is doing a bathroom, have you mentioned our bathware and vanity range?<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">53<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>website quotes get shared with partners, spouses, and builders — make ours look professional.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">54<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>tell every customer — <em>let me put together a full quote so you can see everything with images<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">55<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>manual quotes are forgettable — website quotes are visual, professional, and stay in their inbox.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">56<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>what will the customer need that they haven't thought to ask about yet? Mention it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">57<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the quote is our best marketing tool — every customer should leave with one.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">58<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>if they're tiling a floor, have you mentioned the cleaning products that protect that tile long term?<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">59<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>one stop shop is our advantage — use it. Tiles, bathware, laminate, trade. Mention the full range.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">60<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did every customer today leave with a website quote in their inbox?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · Add Value<\u002Fdiv>\n      <p>Use these nudges when you see manual quotes happening, or when staff aren't thinking beyond the immediate product request. The website quote metric works well on the Scoreboard this week.<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"step-divider\" data-screen-label=\"T — Take Responsibility\">\n      <span class=\"lbadge lg\">T<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">Take Responsibility<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Full quote read-back — name, size, details, quantity, availability, guarantee.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">61<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>read back every quote in full before the customer leaves — name, size, quantity, availability, guarantee.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">62<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>a slow read-back catches errors before they become problems — take your time.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">63<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the read-back isn't a formality — it's how we prevent wrong orders and protect the customer.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">64<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>if something goes wrong, own it — don't redirect, don't explain, don't make excuses. Fix it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">65<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>mention the returns policy and the 10-year guarantee on every quote — every time.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">66<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the customer should leave knowing exactly what they ordered and exactly when it arrives.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">67<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>read back the tile name, not just the code — the customer needs to recognise what they've ordered.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">68<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>if you catch an error during a read-back, thank the customer — that's exactly why we do it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">69<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>ownership means following up — if you promised to call, call. If you said you'd check, check.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">70<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>never say <em>that's not my department<\u002Fem> — own the problem until it's solved.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">71<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>pause after each item in the read-back — give the customer time to confirm before moving on.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">72<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>a thorough read-back takes two minutes and prevents a disaster on installation day.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">73<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>the guarantee is a selling point — make sure every customer knows their tiles are backed for 10 years.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">74<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>if a customer has a complaint, your first words are <em>I'm sorry, let me fix this<\u002Fem> — not anything else.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">75<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did you read back every quote in full before the customer left the counter?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · Take Responsibility<\u002Fdiv>\n      <p>Use these nudges when you hear rushed counter interactions or when an order error has occurred. Pair with a slow read-back demonstration during your Monday micro install.<\u002Fp>\n    <\u002Faside>\n\n    <div class=\"step-divider\" data-screen-label=\"E — End Memorably\">\n      <span class=\"lbadge lg\">E<\u002Fspan>\n      <div class=\"meta\"><div class=\"step-name\">End Memorably<\u002Fdiv><p class=\"non-neg\"><strong>Non-Negotiable<\u002Fstrong>Always thank by name, reference their project, invite them back.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section class=\"nudges\">\n      <div class=\"nudges-list\">\n        <div class=\"nudge-row\"><div class=\"nudge-n\">76<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>every customer leaves with a personalised goodbye — their name, their project, an invitation to return.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">77<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan><em>Thanks, have a good day<\u002Fem> is not our close — make the ending as warm as the greeting.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">78<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the last thing they experience is what they remember most — make it count.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">79<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>reference their project specifically — not <em>good luck with the tiles<\u002Fem>, but <em>I hope the bathroom looks amazing<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">80<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>invite them to come back and show you photos — it's genuine and they love it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">81<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>a warm close turns a transaction into a relationship — they'll come back and they'll refer people.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">82<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>if you know their name, use it in the goodbye — people remember being called by name.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">83<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>match your energy to theirs — an excited customer gets enthusiasm, a quiet one gets warmth.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">84<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>don't rush the close — the last 30 seconds matter as much as the first 30.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">85<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>offer your direct number at the close — <em>if questions come up during installation, call me<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">86<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>an invitation to return is not a sales tactic — it's genuine care, and customers can tell the difference.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">87<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Focus today:<\u002Fspan>the ending is the final impression — make sure it's better than what they expected.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">88<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>think about what detail from their project you can reference — their deadline, their style, their challenge.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">89<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">This shift:<\u002Fspan>a memorable close means the customer leaves smiling — check yourself at the end of each interaction.<\u002Fdiv><\u002Fdiv>\n        <div class=\"nudge-row\"><div class=\"nudge-n\">90<\u002Fdiv><div class=\"nudge-text\"><span class=\"lead\">Today:<\u002Fspan>one question — did every customer today leave with a personalised goodbye they'll actually remember?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside class=\"tip\">\n      <div class=\"field-label\">Manager tip · End Memorably<\u002Fdiv>\n      <p>Use these nudges in the final week of your rotation or whenever you notice generic closings. A memorable close is something you can praise publicly during your floor walk.<\u002Fp>\n    <\u002Faside>\n\n    <section class=\"closing\">\n      <div class=\"line\">90 mornings.<\u002Fdiv>\n      <div class=\"line\">One sentence each.<\u002Fdiv>\n      <div class=\"line\">CREATE stays alive.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"remember\">\n      <div class=\"field-label\">The Daily Manager Question<\u002Fdiv>\n      <p>Which CREATE behaviour did I reinforce today?<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv><!-- /toolkit-frame -->\n\n<div class=\"save-flash\" id=\"saveFlash\">✓ Saved for this week<\u002Fdiv>\n\n<script>\n// ── Tab nav: smooth-scroll + intersection-observed active state ───\n(function() {\n  var ids = ['top', 'script', 'os', 'check', 'scoreboards', 'nudges'];\n  var sections = ids.map(function(id) { return document.getElementById(id); }).filter(Boolean);\n  var tabs = document.querySelectorAll('.toolkit-nav a.tab');\n\n  function setActive(id) {\n    tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.target === id); });\n  }\n\n  // Intra-page anchor links also need smooth-scroll\n  document.querySelectorAll('a[data-target], a[href^=\"#\"]').forEach(function(a) {\n    a.addEventListener('click', function(e) {\n      var href = a.getAttribute('href') || '';\n      if (!href.startsWith('#')) return;\n      var id = href.slice(1);\n      var target = document.getElementById(id);\n      if (!target) return;\n      e.preventDefault();\n      target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      history.replaceState(null, '', '#' + id);\n    });\n  });\n\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function(entries) {\n      entries.forEach(function(e) {\n        if (e.isIntersecting) setActive(e.target.id);\n      });\n    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });\n    sections.forEach(function(s) { io.observe(s); });\n  }\n\n  // Deep-link on load\n  if (location.hash) {\n    var id = location.hash.slice(1);\n    if (document.getElementById(id)) setActive(id);\n  } else {\n    setActive('top');\n  }\n})();\n\n// ── Behaviour Check (Friday traffic light) ─────────────────────\n(function() {\n  var ratings = {};\n  document.querySelectorAll('.tl-buttons').forEach(function(group) {\n    var letter = group.getAttribute('data-letter');\n    group.querySelectorAll('.tl-btn').forEach(function(btn) {\n      btn.addEventListener('click', function() {\n        group.querySelectorAll('.tl-btn').forEach(function(b) { b.classList.remove('selected'); });\n        btn.classList.add('selected');\n        ratings[letter] = btn.getAttribute('data-colour');\n        updateSummary();\n      });\n    });\n  });\n\n  document.querySelectorAll('[data-check]').forEach(function(el) {\n    el.addEventListener('click', function() { el.classList.toggle('checked'); });\n  });\n\n  function updateSummary() {\n    ['C','R','E1','A','T','E2'].forEach(function(k) {\n      var dot = document.getElementById('sum-' + k);\n      if (!dot) return;\n      var r = ratings[k];\n      dot.className = 'tl-summary-dot' + (r ? ' ' + r : '');\n      dot.textContent = r ? '●' : '–';\n    });\n  }\n\n  var saveBtn = document.getElementById('saveCheck');\n  if (saveBtn) saveBtn.addEventListener('click', function() {\n    var flash = document.getElementById('saveFlash');\n    flash.classList.add('show');\n    setTimeout(function() { flash.classList.remove('show'); }, 2200);\n  });\n\n  var resetBtn = document.getElementById('resetCheck');\n  if (resetBtn) resetBtn.addEventListener('click', function() {\n    ratings = {};\n    document.querySelectorAll('.tl-btn').forEach(function(b) { b.classList.remove('selected'); });\n    document.querySelectorAll('.tl-check').forEach(function(c) { c.classList.remove('checked'); });\n    updateSummary();\n  });\n})();\n\n// ── Week display (for the Behaviour Check) ─────────────────────\n(function() {\n  var wd = document.getElementById('weekDisplay');\n  if (!wd) return;\n  var now = new Date();\n  var day = now.getDay();\n  var diff = now.getDate() - day + (day === 0 ? -6 : 1);\n  var monday = new Date(now);\n  monday.setDate(diff);\n  wd.textContent = monday.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
